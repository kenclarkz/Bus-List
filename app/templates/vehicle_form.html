{% extends "base.html" %}
{% block title %}{{ 'Edit Vehicle' if vehicle else 'New Vehicle' }}{% endblock %}
{% block content %}
<h1>{{ 'Edit Vehicle ' ~ vehicle.unit_number if vehicle else 'New Vehicle' }}</h1>
<div class="card">
  <form method="post" action="{{ url_for('vehicle_edit', vehicle_id=vehicle.id) if vehicle else url_for('vehicle_new') }}">
    <div class="form-row">
      <div><label>Unit / Vehicle Number *</label>
        <input type="text" name="unit_number" required value="{{ vehicle.unit_number if vehicle else '' }}"></div>
      <div><label>Vehicle Type</label>
        <input type="text" name="vehicle_type" value="{{ vehicle.vehicle_type.name if vehicle and vehicle.vehicle_type else '' }}"></div>
    </div>
    <div class="form-row">
      <div><label>Make</label>
        <input type="text" name="make" value="{{ vehicle.make if vehicle and vehicle.make else '' }}"></div>
      <div><label>Model</label>
        <input type="text" name="model" value="{{ vehicle.model if vehicle and vehicle.model else '' }}"></div>
    </div>
    <div class="form-row">
      <div><label>Capacity</label>
        <input type="number" name="capacity" value="{{ vehicle.capacity if vehicle else 0 }}"></div>
      <div><label>Description</label>
        <input type="text" name="description" value="{{ vehicle.description if vehicle and vehicle.description else '' }}"></div>
    </div>
    <div class="form-row">
      <div><label>Route / Assignment</label>
        <input type="text" name="route" value="{{ vehicle.route if vehicle else '' }}"></div>
      <div><label>Status / Location</label>
        <input type="text" name="status" value="{{ vehicle.status if vehicle and vehicle.status else 'Active' }}"></div>
    </div>
    <div class="form-row">
      <div><label>Cleaning Frequency (days)</label>
        <input type="number" name="cleaning_frequency" value="{{ vehicle.cleaning_frequency if vehicle else 7 }}"></div>
      <div><label>Active</label>
        <input type="checkbox" name="active" {{ 'checked' if not vehicle or vehicle.active }} style="width:22px;height:22px;margin-top:8px"></div>
    </div>
    <label>Notes</label>
    <textarea name="notes" rows="3">{{ vehicle.notes if vehicle else '' }}</textarea>
    <div class="flex" style="margin-top:16px">
      <button type="submit" class="btn success">Save</button>
      <a class="btn secondary" href="{{ url_for('vehicle_detail', vehicle_id=vehicle.id) if vehicle else url_for('vehicle_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
