{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}
<h1>Employees</h1>
<div class="card">
  <h2>Add Employee</h2>
  <form method="post" action="{{ url_for('employees_page') }}" class="flex">
    <input type="text" name="name" placeholder="Employee name" required>
    <button class="btn" type="submit">Add</button>
  </form>
</div>
<div class="card">
  <h2>Current Staff</h2>
  <table>
    <tr><th>Name</th><th>Active</th></tr>
    {% for e in employees %}
    <tr><td>{{ e.name }}</td><td>{{ 'Yes' if e.active else 'No' }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
