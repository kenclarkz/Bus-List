{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}
<h1>Employees</h1>
<div class="card">
  <h2>Add Employee</h2>
  <form method="post" action="{{ url_for('employees_page') }}" class="flex">
    <input type="text" name="name" placeholder="Employee name" required>
    <button class="btn" type="submit">Add</button>
  </form>
</div>
<div class="card">
  <h2>Current Staff</h2>
  <div class="table-wrap">
  <table>
    <tr><th>Name</th><th>Active</th><th>Action</th></tr>
    {% for e in employees %}
    <tr>
      <td>{{ e.name }}</td>
      <td>{{ 'Yes' if e.active else 'No' }}</td>
      <td>
        <form method="post" action="{{ url_for('employee_toggle_active', employee_id=e.id) }}" style="display:inline"
              onsubmit="{% if e.active %}return confirm('Remove {{ e.name }} from staff? Completed work and history will be kept.'){% endif %}">
          <button type="submit" class="btn small {{ 'danger' if e.active else 'success' }}">
            {{ 'Remove' if e.active else 'Reactivate' }}
          </button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
  </div>
</div>
{% endblock %}
